services:
  # A Django web service
  - type: web
    name: nextwatch
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn next_watch.wsgi:application --workers=1 --threads=2 --timeout=120 --max-requests=1000 --log-file=- --log-level=info
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://staging.d2yfvrdludn658.amplifyapp.com"
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://staging.d2yfvrdludn658.amplifyapp.com"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      # Add your TMDB API key in the Render dashboard
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false
      # Database configuration - use AWS RDS PostgreSQL
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
